<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TmpUp - Painel de trabalho</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;background:#f5f6f8;color:#1a1d21;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  a{color:#1d4ed8;text-decoration:none}
  button,input,select{font-family:inherit;font-size:inherit}
  .header{height:56px;background:#fff;border-bottom:1px solid #dfe3e8;display:flex;align-items:center;padding:0 16px;gap:16px;flex-shrink:0}
  .wordmark{width:232px;font-weight:700;font-size:1.15rem;color:#1a1d21;text-decoration:none;flex-shrink:0}
  .search-wrap{position:relative;flex:1;max-width:640px;display:flex;align-items:center}
  .search-icon{position:absolute;left:10px;color:#5c6470;pointer-events:none}
  .search-input{width:100%;height:36px;background:#f5f6f8;border:1px solid #cfd5dc;border-radius:8px;padding:0 34px;font-size:13px;color:#1a1d21;outline:none}
  .search-input:focus{border-color:#1d4ed8;background:#fff}
  .kbd-hint{position:absolute;right:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#5c6470;border:1px solid #cfd5dc;border-radius:4px;padding:1px 5px;background:#fff;pointer-events:none}
  .summary-bar{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#5c6470;white-space:nowrap}
  .user-email{font-size:13px;color:#454c57;white-space:nowrap}
  .hdr-link{font-size:13px;color:#454c57;border:1px solid #dfe3e8;border-radius:6px;padding:4px 10px}.hdr-link:hover{background:#f1f4f9;color:#1a1d21}
  .main-wrap{display:flex;flex:1;min-height:0;overflow:hidden}
  .sidebar{width:264px;background:#fff;border-right:1px solid #dfe3e8;display:flex;flex-direction:column;padding:12px;gap:8px;flex-shrink:0;overflow-y:auto}
  .place-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:7px 10px;background:none;border:none;border-radius:6px;font-size:13px;color:#1a1d21;cursor:pointer;text-align:left}.place-btn:hover{background:#f1f4f9}.place-btn.active{background:#e3e8ff;font-weight:700}
  .sidebar-sec{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#5c6470;font-weight:600;margin-top:10px;padding:0 4px}
  .btn-new-folder{background:#fff;border:1px solid #dfe3e8;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:#1a1d21;display:inline-flex;align-items:center;gap:4px}.btn-new-folder:hover{background:#f1f4f9}
  .folder-filter{width:100%;height:32px;background:#f5f6f8;border:1px solid #cfd5dc;border-radius:6px;padding:0 8px;font-size:12px;color:#1a1d21;outline:none}
  .folder-list{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:40px}
  .folder-item{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:6px;border:none;background:none;cursor:pointer;font-size:13px;color:#1a1d21;text-align:left}.folder-item:hover{background:#f1f4f9}.folder-item.active{background:#e3e8ff;font-weight:700}
  .folder-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .folder-count{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#5c6470}
  .content-col{display:flex;flex-direction:column;flex:1;min-width:0;padding:12px 16px 0;gap:10px;overflow:hidden}
  .dropzone{border:2px dashed #1d4ed8;background:#eef3ff;border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;flex-shrink:0}.dropzone.dragover{background:#e3e8ff;border-color:#173da8}
  .dropzone-lead{display:flex;align-items:center;gap:10px;min-width:0}
  .dropzone-ctrls{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .dropzone-ctrls label{font-size:12px;color:#5c6470}
  .dropzone-ctrls select{border:1px solid #cfd5dc;border-radius:6px;padding:4px 8px;font-size:12px;background:#fff;color:#1a1d21}
  .progress-wrap{height:6px;background:#dfe3e8;border-radius:3px;overflow:hidden;display:none;flex-shrink:0;margin-top:2px}.progress-wrap.active{display:block}
  .progress-bar{height:100%;background:#1d4ed8;width:0%;transition:width .2s}
  .progress-text{font-size:11px;color:#5c6470;margin-top:2px}
  .status{font-size:12px;min-height:16px}.status.error{color:#b42318}.status.success{color:#166534}
  .title-row{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .breadcrumb{font-size:13px;color:#5c6470;display:inline-flex;align-items:center;gap:4px}
  .breadcrumb button{background:none;border:none;color:#1d4ed8;cursor:pointer;padding:0}
  .title-h1{font-size:1.15rem;font-weight:700;color:#1a1d21}
  .title-count{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#5c6470}
  .folder-actions{display:inline-flex;gap:6px}
  .btn-sub{background:#fff;border:1px solid #dfe3e8;border-radius:6px;padding:4px 10px;font-size:12px;color:#1a1d21;cursor:pointer}.btn-sub:hover{background:#f1f4f9}
  .btn-sub.danger{color:#b42318;border-color:#dfe3e8}.btn-sub.danger:hover{background:#fff2f0;border-color:#b42318}
  .spacer{flex:1}
  .chip-row{display:flex;gap:4px}
  .chip{background:#fff;border:1px solid #dfe3e8;border-radius:6px;padding:4px 10px;font-size:12px;color:#454c57;cursor:pointer}.chip.active{background:#1a1d21;color:#fff;border-color:#1a1d21}
  .list-card{background:#fff;border:1px solid #dfe3e8;border-radius:10px 10px 0 0;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
  .list-header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eceff3;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:#5c6470;text-transform:uppercase;z-index:2}
  .file-list-body{flex:1;padding:0}
  .load-more-btn{margin:12px auto;padding:8px 16px;border:1px solid #dfe3e8;border-radius:6px;background:#fff;font-size:13px;font-weight:600;color:#1a1d21;cursor:pointer;display:block}.load-more-btn:hover{background:#f1f4f9}
  .bulk-bar{display:none;align-items:center;gap:10px;background:#1a1d21;border-radius:8px;padding:8px 12px;font-size:12px;color:#fff}.bulk-bar.active{display:flex}
  .bulk-btn{background:#2a2e33;border:1px solid #454c57;border-radius:6px;padding:4px 10px;font-size:12px;color:#fff;cursor:pointer}.bulk-btn.danger{background:#7f1d1d;border-color:#b42318;color:#fecaca}
  .bulk-cancel{background:none;border:none;color:#93c5fd;font-size:12px;cursor:pointer;text-decoration:underline}
  .list-row{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-bottom:1px solid #eceff3;font-size:13px;color:#1a1d21}.list-row:hover{background:#f1f4f9}
  .list-row.folder-row{background:#fffaf0}
  .list-row.version-row{height:32px;background:#f7f8fb;font-size:12px;color:#454c57}
  .day-header{display:flex;align-items:baseline;gap:8px;padding:10px 12px 6px;border-bottom:1px solid #eceff3}
  .day-title{font-size:13px;font-weight:700;color:#1a1d21}
  .day-sub{font-size:12px;color:#5c6470}
  .cell-check{width:18px;display:flex;align-items:center;flex-shrink:0}
  .select-box{width:16px;height:16px;accent-color:#1d4ed8;cursor:pointer}
  .cell-time{width:84px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#5c6470;flex-shrink:0}
  .cell-type{width:46px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cell-name{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden}
  .row-name{color:#1a1d21;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.row-name:hover{text-decoration:underline}
  .folder-name-btn{background:none;border:none;padding:0;font-size:13px;font-weight:700;color:#1a1d21;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder-name-btn:hover{text-decoration:underline}
  .cell-size{width:78px;text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#454c57;flex-shrink:0}
  .cell-exp{width:64px;text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#454c57;flex-shrink:0}
  .cell-exp.soon{color:#9a3412;font-weight:700}
  .cell-views{width:52px;text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#454c57;flex-shrink:0;cursor:default}
  .cell-actions{width:138px;display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-shrink:0}
  .type-badge{width:46px;height:22px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:700;line-height:22px;text-align:center;letter-spacing:.03em;display:inline-block}
  .badge-image{background:#dcf5e7;color:#14532d}
  .badge-video{background:#e3e8ff;color:#27348b}
  .badge-document{background:#fdefd2;color:#7c4a03}
  .badge-other{background:#e9ecf0;color:#2f3640}
  .file-thumb{width:28px;height:28px;object-fit:cover;border-radius:4px;display:block}
  .ver-chip{background:#e3e8ff;color:#27348b;border:none;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;cursor:pointer;flex-shrink:0}
  .folder-chip{background:#f3e3c2;color:#5a3d05;border-radius:999px;font-size:11px;font-weight:600;padding:1px 7px;white-space:nowrap;flex-shrink:0;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  .more-panel{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#f7f8fb;border-bottom:1px solid #eceff3;font-size:12px;color:#454c57;flex-wrap:wrap}
  .panel-select{border:1px solid #cfd5dc;border-radius:6px;padding:3px 6px;font-size:12px;background:#fff;color:#1a1d21}
  .bulk-select{border:1px solid #454c57;border-radius:6px;padding:4px 8px;font-size:12px;background:#2a2e33;color:#fff}
  #locSelect{display:none}
  @media (max-width: 1000px){.cell-size,.cell-exp,.cell-views,.col-size,.col-exp,.col-views{display:none}}
  @media (max-width: 760px){.sidebar{display:none}#locSelect{display:block;width:100%;height:36px;border:1px solid #cfd5dc;border-radius:6px;padding:0 8px;font-size:13px;background:#fff;color:#1a1d21;margin-bottom:4px}}
  .btn-copy-link{background:#1d4ed8;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}.btn-copy-link:hover{background:#1e40af}.btn-copy-link.copied{background:#15803d}
  .renew-row{display:flex;gap:4px;padding:4px 12px;background:#f7f8fb;border-bottom:1px solid #eceff3}
  .renew-chip{background:#fff;border:1px solid #cfd5dc;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer}.renew-chip:hover{background:#e3e8ff;border-color:#1d4ed8}
  .btn-sub-action{background:#fff;border:1px solid #dfe3e8;border-radius:6px;padding:4px 8px;font-size:12px;color:#1a1d21;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.btn-sub-action:hover{background:#f1f4f9}
  .btn-sub-action.danger{color:#b42318}.btn-sub-action.danger-confirm{background:#b42318;border-color:#b42318;color:#fff}
  .empty-state{text-align:center;color:#5c6470;padding:32px;font-size:13px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1d21;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999}.toast.show{opacity:1}
</style>
</head>
<body>
<header class="header">
  <a class="wordmark" href="/">tmpup</a>
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="searchInput" placeholder="Buscar em tudo: arquivos e pastas"><kbd class="kbd-hint">/</kbd>
  </div>
  <div class="summary-bar" id="summaryBar"></div><span class="user-email" id="userEmail"></span>
  <a class="hdr-link" href="/mcp-setup">MCP</a><a class="hdr-link" href="/auth/logout">Sair</a>
</header>
<div class="main-wrap">
  <aside class="sidebar" id="sidebar">
    <button class="place-btn active" data-place="all" type="button"><span>Tudo</span><span class="folder-count" id="countAll">0</span></button>
    <button class="place-btn" data-place="root" type="button"><span>Sem pasta</span><span class="folder-count" id="countRoot">0</span></button>
    <button class="place-btn" data-place="expiring" type="button"><span>Com validade</span></button>
    <div class="sidebar-sec"><span>Pastas &middot; mais recentes primeiro</span><button class="btn-new-folder" id="btnNewFolder" type="button"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nova pasta</button></div>
    <input class="folder-filter" id="folderSearch" placeholder="Filtrar pastas">
    <div class="folder-list" id="folderList"></div>
  </aside>
  <main class="content-col">
    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" multiple style="display:none">
      <div class="dropzone-lead">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <div><div style="font-weight:600">Solte arquivos aqui ou clique para enviar</div><div style="font-size:12px;color:#5c6470">Ctrl+V envia um print</div></div>
      </div>
      <div class="dropzone-ctrls">
        <label for="destSelect">Guardar em</label><select id="destSelect"><option value="">Sem pasta</option></select>
        <label for="ttlSelect">Validade</label>
        <select id="ttlSelect"><option value="0" selected>Nunca expira</option><option value="3600">1 hora</option><option value="21600">6 horas</option><option value="86400">24 horas</option><option value="259200">3 dias</option><option value="604800">7 dias</option></select>
      </div>
    </div>
    <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText" style="display:none"></div>
    <div class="status" id="status"></div>
    <select id="locSelect" aria-label="Navegação"><option value="all">Tudo</option><option value="root">Sem pasta</option><option value="expiring">Com validade</option></select>
    <div class="title-row">
      <div class="breadcrumb" id="breadcrumb"></div><h1 class="title-h1" id="viewTitle">Tudo</h1><span class="title-count" id="titleCount">0 arquivos</span>
      <div class="folder-actions" id="folderActions"><button class="btn-sub" id="btnDownloadFolder" type="button" hidden>Baixar .zip</button><button class="btn-sub danger" id="btnDeleteFolder" type="button" hidden>Excluir pasta</button></div>
      <div class="spacer"></div>
      <div class="chip-row" id="chipRow">
        <button class="chip active" data-kind="all" type="button">Todos</button>
        <button class="chip" data-kind="image" type="button">Imagens</button>
        <button class="chip" data-kind="document" type="button">Documentos</button>
        <button class="chip" data-kind="video" type="button">Vídeos</button>
        <button class="chip" data-kind="archive" type="button">Outros</button>
      </div>
      <select id="sortSelect" style="display:none"></select>
    </div>
    <div class="bulk-bar" id="bulkBar">
      <span id="bulkCount">0 selecionado(s)</span>
      <div class="spacer"></div>
      <select class="bulk-select" id="bulkMoveSelect" aria-label="Mover para pasta"><option value="" disabled selected>Mover para pasta</option><option value="root">Sem pasta</option></select>
      <button class="bulk-btn" id="bulkCopyBtn" type="button">Copiar links</button>
      <button class="bulk-btn" id="bulkRenewBtn" type="button">Nunca expira</button>
      <button class="bulk-btn danger" id="bulkDeleteBtn" type="button">Excluir</button>
      <button class="bulk-cancel" id="bulkCancelBtn" type="button">Cancelar</button>
    </div>
    <div class="list-card">
      <div class="list-header">
        <span style="width:18px"></span><span style="width:84px">Enviado</span><span style="width:46px">Tipo</span><span style="flex:1">Nome</span><span class="col-size" style="width:78px;text-align:right">Tamanho</span><span class="col-exp" style="width:64px;text-align:right">Expira</span><span class="col-views" style="width:52px;text-align:right">Vistas</span><span style="width:138px"></span>
      </div>
      <div class="file-list-body" id="fileList"></div>
      <button class="load-more-btn" id="loadMoreBtn" type="button" style="display:none">Carregar mais antigos</button>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const destSelect = document.getElementById('destSelect');
  const ttlSelect = document.getElementById('ttlSelect');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const statusEl = document.getElementById('status');
  const fileList = document.getElementById('fileList');
  const toast = document.getElementById('toast');
  const summaryBar = document.getElementById('summaryBar');
  const searchInput = document.getElementById('searchInput');
  const chipRow = document.getElementById('chipRow');
  const bulkBar = document.getElementById('bulkBar');
  const bulkCount = document.getElementById('bulkCount');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const folderList = document.getElementById('folderList');
  const folderSearch = document.getElementById('folderSearch');
  const breadcrumb = document.getElementById('breadcrumb');
  const viewTitle = document.getElementById('viewTitle');
  const titleCount = document.getElementById('titleCount');
  const btnNewFolder = document.getElementById('btnNewFolder');
  const btnDownloadFolder = document.getElementById('btnDownloadFolder');
  const btnDeleteFolder = document.getElementById('btnDeleteFolder');
  const sidebar = document.getElementById('sidebar');
  const countAll = document.getElementById('countAll');
  const countRoot = document.getElementById('countRoot');
  const locSelect = document.getElementById('locSelect');
  const bulkMoveSelect = document.getElementById('bulkMoveSelect');
  const bulkCopyBtn = document.getElementById('bulkCopyBtn');

  let loc = 'all';
  let currentFolderName = '';
  let displayedFolders = [];
  let displayedFiles = [];
  let currentSummary = { total: 0, total_size_bytes: 0, expiring_soon_count: 0 };
  let currentPage = 1;
  let totalPages = 1;
  let totalFiles = 0;
  let lastRootTotalFiles = 0;
  let currentKind = 'all';
  let currentQuery = '';
  let selectedIds = new Set();
  let openVersions = new Set();
  let openPanelId = null;
  let confirmingId = null;
  let searchDebounceTimer = null;
  let loadFilesRequestId = 0;
  let loadFoldersRequestId = 0;

  function isFolder(val) { return val && val !== 'all' && val !== 'root' && val !== 'expiring'; }
  function logError(msg, err, id) { const o = { svc: 'tmpup-web', msg, err: String(err) }; if(id != null) o.id = id; console.error(JSON.stringify(o)); }

  dropzone.addEventListener('click', ev => { if(!ev.target.closest('select, label, option')) fileInput.click(); });
  ['dragenter','dragover'].forEach(e => dropzone.addEventListener(e, ev => { ev.preventDefault(); dropzone.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(e => dropzone.addEventListener(e, ev => { ev.preventDefault(); dropzone.classList.remove('dragover'); }));
  dropzone.addEventListener('drop', ev => { const files = Array.from(ev.dataTransfer.files); if(files.length) uploadFiles(files); });
  fileInput.addEventListener('change', () => { const files = Array.from(fileInput.files); if(files.length) uploadFiles(files); });

  window.addEventListener('paste', ev => {
    const items = (ev.clipboardData && ev.clipboardData.items) || [];
    const imageItem = Array.from(items).find(it => it.type && it.type.startsWith('image/'));
    if(!imageItem) return;
    const blob = imageItem.getAsFile();
    if(!blob) return;
    const ext = (blob.type.split('/')[1] || 'png').split('+')[0];
    const file = new File([blob], `print-colado-${Date.now()}.${ext}`, { type: blob.type });
    uploadFiles([file]);
  });

  async function uploadFiles(files) {
    if(!files || !files.length) return;
    const ttl = ttlSelect.value;
    const targetFolder = destSelect.value || null;
    let uploaded = 0;
    for(const file of files) {
      await uploadOne(file, ttl, files.length, ++uploaded, targetFolder);
    }
    fileInput.value = '';
    await loadFiles();
    await loadFolders();
  }

  function uploadRequest(method, url, body, headers, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open(method, url);
      xhr.timeout = 180000;
      Object.entries(headers || {}).forEach(([name, value]) => xhr.setRequestHeader(name, value));
      xhr.upload.addEventListener('progress', ev => {
        if(ev.lengthComputable && onProgress) onProgress(ev.loaded);
      });
      xhr.addEventListener('load', () => {
        let data;
        try { data = JSON.parse(xhr.responseText); } catch(e) { data = {}; }
        if(xhr.status >= 200 && xhr.status < 300) return resolve(data);
        const message = xhr.status === 413 ? 'O servidor recusou o tamanho do envio.' :
          (data.detail || data.error || `Falha no envio (HTTP ${xhr.status}).`);
        const error = new Error(message);
        error.retryable = xhr.status === 408 || xhr.status === 429 || xhr.status >= 500;
        reject(error);
      });
      const networkError = message => { const error = new Error(message); error.retryable = true; reject(error); };
      xhr.addEventListener('error', () => networkError('Conexão interrompida durante o envio.'));
      xhr.addEventListener('timeout', () => networkError('O envio demorou demais. Verifique a conexão e tente novamente.'));
      xhr.addEventListener('abort', () => reject(new Error('Envio cancelado.')));
      xhr.send(body);
    });
  }

  async function retryUpload(operation) {
    for(let attempt = 0; ; attempt++) {
      try { return await operation(); }
      catch(error) {
        if(!error.retryable || attempt >= 3) throw error;
        await new Promise(resolve => setTimeout(resolve, 1000 * Math.pow(2, attempt)));
      }
    }
  }

  async function uploadChunks(file, ttl, onProgress, folderId) {
    const session = await uploadRequest('POST', '/api/uploads',
      JSON.stringify({ filename: file.name, size: file.size, ttl: Number(ttl), folder_id: folderId || null }),
      { 'Content-Type': 'application/json' });
    const chunkSize = Math.min(session.chunk_size, 8 * 1024 * 1024);
    if(!session.upload_id || !Number.isSafeInteger(chunkSize) || chunkSize <= 0) throw new Error('Resposta de upload inválida.');
    const url = '/api/uploads/' + encodeURIComponent(session.upload_id);
    try {
      for(let offset = 0; offset < file.size;) {
        const end = Math.min(offset + chunkSize, file.size);
        const data = await retryUpload(() => uploadRequest('PUT', url + '?offset=' + offset,
          file.slice(offset, end), { 'Content-Type': 'application/octet-stream' },
          loaded => onProgress(Math.min(offset + loaded, file.size))));
        if(data.offset !== end) throw new Error('O servidor não confirmou o bloco enviado.');
        offset = end;
        onProgress(offset);
      }
      return await retryUpload(() => uploadRequest('POST', url + '/complete', null));
    } catch(error) {
      try { await uploadRequest('DELETE', url, null); } catch(cleanupError) {}
      throw error;
    }
  }

  async function uploadOne(file, ttl, total, idx, folderId) {
    const targetFolder = folderId !== undefined ? folderId : (destSelect.value || null);
    progressWrap.classList.add('active');
    progressText.style.display = 'block';
    progressBar.style.width = '0%';
    const prefix = total > 1 ? `[${idx}/${total}] ` : '';
    progressText.textContent = `${prefix}Enviando ${file.name}...`;
    statusEl.className = 'status';
    statusEl.textContent = '';
    try {
      const onProgress = loaded => {
        const pct = Math.min(99, Math.round((loaded / file.size) * 100));
        progressBar.style.width = pct + '%';
        progressText.textContent = `${prefix}Enviando ${file.name}... ${pct}%`;
      };
      if(file.size > 8 * 1024 * 1024) await uploadChunks(file, ttl, onProgress, targetFolder);
      else {
        const headers = { 'X-Filename': encodeURIComponent(file.name), 'X-TTL': ttl, 'Content-Type': 'application/octet-stream' };
        if(targetFolder) headers['X-Folder-Id'] = targetFolder;
        await uploadRequest('POST', '/api/upload', file, headers, onProgress);
      }
      progressBar.style.width = '100%';
      progressText.textContent = `${prefix}Concluido!`;
      statusEl.className = 'status success';
      statusEl.textContent = `${file.name} enviado com sucesso!`;
      setTimeout(() => { progressWrap.classList.remove('active'); progressText.style.display = 'none'; }, 1500);
    } catch(err) {
      logError('upload_failed', err);
      progressWrap.classList.remove('active');
      progressText.style.display = 'none';
      statusEl.className = 'status error';
      statusEl.textContent = `Erro: ${err.message}`;
    }
  }

  // --- File list & folders (real API) ---
  async function loadFiles(append) {
    const requestId = ++loadFilesRequestId;
    if(!append) currentPage = 1;
    try {
      let query = `stack=1&kind=${encodeURIComponent(currentKind)}&page=${currentPage}`;
      if(currentQuery) {
        query += `&q=${encodeURIComponent(currentQuery)}&sort=date`;
      } else if(loc === 'expiring') {
        query += '&expiring=1&sort=expiry';
      } else if(loc === 'all' || loc === 'root') {
        query += '&folder_id=root&sort=date';
      } else {
        query += `&folder_id=${encodeURIComponent(loc)}&sort=name`;
      }
      const res = await fetch(`/api/files?${query}`);
      if(requestId !== loadFilesRequestId) return;
      if(!res.ok) {
        logError('load_files_failed', res.statusText);
        fileList.innerHTML = '<div class="empty-state">Erro ao carregar arquivos</div>';
        return;
      }
      const data = await res.json();
      if(requestId !== loadFilesRequestId) return;
      if(!data || !Array.isArray(data.items)) {
        logError('load_files_failed', 'invalid_data');
        fileList.innerHTML = '<div class="empty-state">Erro ao carregar arquivos</div>';
        return;
      }
      totalPages = data.total_pages || 0;
      totalFiles = data.total_files !== undefined ? data.total_files : (data.total || 0);
      if(!currentQuery && currentKind === 'all' && (loc === 'root' || loc === 'all')) {
        lastRootTotalFiles = totalFiles;
        updateSidebarCounts();
      }
      displayedFiles = append ? displayedFiles.concat(data.items) : data.items;
      currentSummary = { total: data.total || 0, total_size_bytes: data.total_size_bytes || 0, expiring_soon_count: data.expiring_soon_count || 0 };
      render();
    } catch(e) {
      if(requestId !== loadFilesRequestId) return;
      logError('load_files_failed', e);
      fileList.innerHTML = '<div class="empty-state">Erro ao carregar arquivos</div>';
    }
  }

  async function loadFolders() {
    const requestId = ++loadFoldersRequestId;
    try {
      const res = await fetch('/api/folders');
      if(requestId !== loadFoldersRequestId) return;
      if(!res.ok) { logError('load_folders_failed', res.statusText); return; }
      const data = await res.json();
      if(requestId !== loadFoldersRequestId) return;
      displayedFolders = Array.isArray(data.items) ? data.items : [];
      displayedFolders.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
      renderFolders();
      updateDestSelect();
      updateSidebarCounts();
      updateLocSelect();
    } catch(e) {
      if(requestId !== loadFoldersRequestId) return;
      logError('load_folders_failed', e);
    }
  }

  function isPreviewable(name) {
    const ext = (name.split('.').pop() || '').toLowerCase();
    return ['png','jpg','jpeg','gif','webp','svg','bmp','ico','tiff','avif','mp4','mov','avi','mkv','webm','mp3','wav','ogg','m4a','aac','flac','opus','pdf'].includes(ext);
  }

  function renderFiles() {
    const rows = buildRows({
      files: displayedFiles, folders: displayedFolders, view: loc,
      kind: currentKind, query: currentQuery, allLoaded: (currentPage >= totalPages), now: new Date()
    });
    if(!rows.length) { fileList.innerHTML = '<div class="empty-state">Nenhum arquivo encontrado</div>'; return; }
    fileList.innerHTML = rows.map(row => {
      if(row.type === 'day') {
        return `<div class="day-header"><div class="day-title">${esc(row.label)}</div><div class="day-sub">${esc(row.summary)}</div></div>`;
      }
      if(row.type === 'folder') {
        const fo = row.folder || row, cnt = fo.file_count === 1 ? '1 arquivo' : `${fo.file_count || 0} arquivos`;
        return `<div class="list-row folder-row"><span class="cell-check"></span><span class="cell-time">${formatTime(fo.updated_at || 0, row.insideDay)}</span><span class="cell-type"><svg width="20" height="20" viewBox="0 0 24 24" fill="#c98a1b"><path d="M2 7a3 3 0 0 1 3-3h4.2a2 2 0 0 1 1.5.7L12 6h7a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3z"/></svg></span><div class="cell-name"><button class="folder-name-btn" data-action="open-folder" data-id="${esc(fo.id)}" data-name="${esc(fo.name)}" type="button">${esc(fo.name)}</button><span class="folder-chip">${cnt}</span></div><span class="cell-size">${formatSize(fo.total_size_bytes || 0)}</span><span class="cell-exp"></span><span class="cell-views"></span><span class="cell-actions"><button class="btn-sub-action" data-action="open-folder" data-id="${esc(fo.id)}" data-name="${esc(fo.name)}" type="button">Abrir</button><a class="btn-sub-action" href="/api/folders/${esc(fo.id)}/download">.zip</a></span></div>`;
      }
      const f = row.file || row;
      const targetUrl = (f.view_url && isPreviewable(f.filename)) ? f.view_url : f.url;
      const thumbOrBadge = f.is_image
        ? `<img class="file-thumb" src="${esc(f.url.replace('/d/', '/t/'))}" alt="" loading="lazy">`
        : `<span class="type-badge badge-${deriveKind(f.filename, f.is_image)}">${esc((f.filename.split('.').pop() || '').toUpperCase().slice(0, 4))}</span>`;
      const hasVersions = Array.isArray(f.versions) && f.versions.length > 0;
      const verChip = hasVersions ? `<button class="ver-chip" data-action="toggle-ver" data-id="${esc(f.id)}" type="button">${f.versions.length + 1} versões</button>` : '';
      const folderChipHtml = row.folderChip ? `<span class="folder-chip" title="${esc(row.folderChip)}">${esc(row.folderChip)}</span>` : '';
      const remaining = formatCountdown(f.expires_in), soon = f.expires_in > 0 && f.expires_in < 3600;
      const viewsStr = f.views ? `${f.views}×` : '—';
      const viewsTitle = `${f.downloads || 0} download(s) · última visualização: ${formatLast(f.last_viewed_at)}`;
      let panelRow = '';
      if(openPanelId === f.id) {
        const isConfirming = confirmingId === f.id;
        const delBtn = isConfirming
          ? `<button class="btn-sub-action danger-confirm" data-action="delete" data-id="${esc(f.id)}" type="button">Excluir?</button>`
          : `<button class="btn-sub-action danger" data-action="delete" data-id="${esc(f.id)}" type="button">Excluir</button>`;
        const folderOpts = displayedFolders.map(fo => `<option value="${esc(fo.id)}" ${f.folder_id === fo.id ? 'selected' : ''}>${esc(fo.name)}</option>`).join('');
        panelRow = `<div class="more-panel" data-panel-id="${esc(f.id)}"><a class="btn-sub-action" href="${esc(f.url)}" download="${esc(f.filename)}">Baixar</a><label style="display:inline-flex;align-items:center;gap:4px">Mover para <select class="panel-select" data-action="move-file" data-id="${esc(f.id)}"><option value="" ${!f.folder_id ? 'selected' : ''}>Sem pasta</option>${folderOpts}</select></label><span style="color:#5c6470">Validade:</span><button class="renew-chip" data-action="renew-apply" data-id="${esc(f.id)}" data-ttl="3600" type="button">1 hora</button><button class="renew-chip" data-action="renew-apply" data-id="${esc(f.id)}" data-ttl="86400" type="button">24 horas</button><button class="renew-chip" data-action="renew-apply" data-id="${esc(f.id)}" data-ttl="604800" type="button">7 dias</button><button class="renew-chip" data-action="renew-apply" data-id="${esc(f.id)}" data-ttl="0" type="button">Nunca expira</button>${delBtn}</div>`;
      }
      let html = `<div class="list-row"><span class="cell-check"><input class="select-box" type="checkbox" data-action="select" data-id="${esc(f.id)}" ${selectedIds.has(f.id) ? 'checked' : ''} aria-label="Selecionar arquivo"></span><span class="cell-time">${formatTime(f.created_at || 0, row.insideDay)}</span><span class="cell-type">${thumbOrBadge}</span><div class="cell-name"><a class="row-name" href="${esc(targetUrl)}" target="_blank" rel="noopener" title="${esc(f.filename)}">${esc(f.filename)}</a>${verChip}${folderChipHtml}</div><span class="cell-size">${formatSize(f.size || 0)}</span><span class="cell-exp ${soon ? 'soon' : ''}" data-action="renew-toggle" data-id="${esc(f.id)}" style="cursor:pointer" title="Renovar validade">${remaining}</span><span class="cell-views" title="${esc(viewsTitle)}">${viewsStr}</span><span class="cell-actions"><button class="btn-copy-link" data-action="copy" data-url="${esc(f.url)}" type="button">Copiar link</button><button class="btn-sub-action btn-more" data-action="toggle-more" data-id="${esc(f.id)}" aria-label="Mais ações" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></span></div>${panelRow}`;`;
      if(hasVersions && openVersions.has(f.id)) {
        for(const v of f.versions) {
          const isConfirming = confirmingId === v.id;
          const delBtn = isConfirming
            ? `<button class="btn-sub-action danger-confirm" data-action="delete" data-id="${esc(v.id)}" type="button">Excluir?</button>`
            : `<button class="btn-sub-action danger" data-action="delete" data-id="${esc(v.id)}" type="button">Excluir</button>`;
          html += `<div class="list-row version-row"><span class="cell-check"></span><span class="cell-time">${formatTime(v.created_at || 0, row.insideDay)}</span><span class="cell-type"></span><div class="cell-name">versão anterior de ${esc(f.filename)}</div><span class="cell-size">${formatSize(v.size || 0)}</span><span class="cell-exp"></span><span class="cell-views"></span><span class="cell-actions"><button class="btn-sub-action" data-action="copy" data-url="${esc(v.url)}" type="button">Copiar link</button>${delBtn}</span></div>`;
        }
      }
      return html;
    }).join('');
  }

  function updateBulkMoveSelect() {
    bulkMoveSelect.innerHTML = '<option value="" disabled selected>Mover para pasta</option><option value="root">Sem pasta</option>' +
      displayedFolders.map(f => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');
    bulkMoveSelect.value = '';

  function renderBulkBar() {
    if(selectedIds.size > 0) {
      bulkBar.classList.add('active');
      bulkCount.textContent = `${selectedIds.size} selecionado(s)`;
      updateBulkMoveSelect();
    } else {
      bulkBar.classList.remove('active');
    }

  // --- Event delegation on the file list ---
  fileList.addEventListener('click', async ev => {
    const btn = ev.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;

    if(action === 'copy') { copyLink(btn.dataset.url, btn); return; }

    if(action === 'open-folder') {
      currentFolderName = btn.dataset.name || '';
      navigate(id);
      return;
    }

    if(action === 'toggle-ver') {
      if(openVersions.has(id)) openVersions.delete(id);
      else openVersions.add(id);
      renderFiles();
      return;
    }

    if(action === 'toggle-more' || action === 'renew-toggle') {
      openPanelId = (openPanelId === id ? null : id);
      confirmingId = null;
      renderFiles();
      return;
    }

    if(action === 'renew-apply') {
      const ttl = parseInt(btn.dataset.ttl, 10);
      try {
        const res = await fetch(`/api/files/${id}/ttl`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ttl })
        });
        if(res.ok) { showToast('Validade renovada'); await loadFiles(); }
        else { logError('renew_file_failed', res.statusText, id); showToast('Erro ao renovar'); }
      } catch(e) {
        logError('renew_file_failed', e, id);
        showToast('Erro ao renovar');
      }
      return;
    }

    if(action === 'delete') {
      if(confirmingId === id) {
        confirmingId = null;
        try {
          const res = await fetch(`/api/files/${id}`, { method: 'DELETE' });
          if(res.ok) {
            showToast('Arquivo removido');
            selectedIds.delete(id);
            if(openPanelId === id) openPanelId = null;
            await loadFiles();
            await loadFolders();
          } else {
            logError('delete_file_failed', res.statusText, id);
            showToast('Erro ao excluir');
          }
        } catch(e) {
          logError('delete_file_failed', e, id);
          showToast('Erro ao excluir');
        }
      } else {
        confirmingId = id;
        renderFiles();
      }
      return;
    }
  });

  fileList.addEventListener('change', async ev => {
    const moveSelect = ev.target.closest('[data-action="move-file"]');
    if(moveSelect) {
      const id = moveSelect.dataset.id;
      const folder_id = moveSelect.value || null;
      try {
        const res = await fetch(`/api/files/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ folder_id })
        });
        if(res.ok) {
          showToast('Arquivo movido');
          await loadFiles();
          await loadFolders();
        } else {
          logError('move_file_failed', res.statusText, id);
          showToast('Erro ao mover');

      } catch(err) {
        logError('move_file_failed', err, id);
        showToast('Erro ao mover');

  });

  window.addEventListener('keydown', ev => {
    if(ev.key === '/' && !['INPUT','TEXTAREA','SELECT'].includes((document.activeElement || {}).tagName)) {
      ev.preventDefault();
      searchInput.focus();
    }
  });

  chipRow.addEventListener('click', ev => {
    const chip = ev.target.closest('.chip');
    if(!chip) return;
    currentKind = chip.dataset.kind;
    chipRow.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
    currentPage = 1;
    selectedIds.clear();
    renderBulkBar();
    loadFiles();
  });

  // --- Bulk actions ---
  locSelect.addEventListener('change', () => { if(locSelect.value) navigate(locSelect.value); });
  document.getElementById('bulkCancelBtn').addEventListener('click', () => { selectedIds.clear(); render(); });
  bulkMoveSelect.addEventListener('change', async () => {
    const target = bulkMoveSelect.value;
    if(!target) return;
    const targetFolder = target === 'root' ? null : target;
    const ids = Array.from(selectedIds);
    if(!ids.length) return;
    const responses = await Promise.all(ids.map(id => fetch(`/api/files/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folder_id: targetFolder })
    }).catch(err => { logError('bulk_move_failed', err, id); return null; })));
    let successCount = 0;
    responses.forEach((res, i) => {
      if(res && res.ok) {
        successCount++;
        selectedIds.delete(ids[i]);
      } else if(res) {
        logError('bulk_move_failed', res.statusText, ids[i]);
      }
    });
    if(successCount === ids.length) {
      showToast(`${ids.length} arquivo(s) movidos`);
    } else {
      showToast(`${successCount} de ${ids.length} movidos`);
    }
    bulkMoveSelect.value = '';
    renderBulkBar();
    await loadFiles();
    await loadFolders();
  });
  bulkCopyBtn.addEventListener('click', () => {
    const ids = Array.from(selectedIds);
    if(!ids.length) return;
    const urls = ids.map(id => {
      const f = displayedFiles.find(x => x.id === id);
      if(!f || !f.url) return null;
      return f.url.startsWith('http') ? f.url : window.location.origin + f.url;
    }).filter(Boolean);
    const text = urls.join('\n');
    if(!text) return;
    navigator.clipboard.writeText(text).then(() => showToast('Links copiados')).catch(err => {
      try {
        const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        showToast('Links copiados');
      } catch(e) {
        logError('copy_failed', err || e);
        showToast('Erro ao copiar links');
      }
    });
  });
  document.getElementById('bulkDeleteBtn').addEventListener('click', async () => {
    const ids = Array.from(selectedIds);
    if(!ids.length) return;
    if(!window.confirm(`Excluir ${ids.length} arquivo(s) selecionado(s)?`)) return;
    const responses = await Promise.all(ids.map(id => fetch(`/api/files/${id}`, { method: 'DELETE' }).catch(err => { logError('bulk_delete_failed', err, id); return null; })));
    let successCount = 0;
    responses.forEach((res, i) => {
      if(res && res.ok) {
        successCount++;
        selectedIds.delete(ids[i]);
      } else if(res) {
        logError('bulk_delete_failed', res.statusText, ids[i]);
      }
    });
    if(successCount === ids.length) {
      showToast(`${ids.length} arquivo(s) excluidos`);
    } else {
      showToast(`${successCount} de ${ids.length} arquivo(s) excluidos`);
    }
    renderBulkBar();
    await loadFiles();
    await loadFolders();
  });
  document.getElementById('bulkRenewBtn').addEventListener('click', async () => {
    const ids = Array.from(selectedIds);
    if(!ids.length) return;
    const responses = await Promise.all(ids.map(id => fetch(`/api/files/${id}/ttl`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ttl: 0 })
    }).catch(err => { logError('bulk_renew_failed', err, id); return null; })));
    let successCount = 0;
    responses.forEach((res, i) => {
      if(res && res.ok) {
        successCount++;
        selectedIds.delete(ids[i]);
      } else if(res) {
        logError('bulk_renew_failed', res.statusText, ids[i]);
      }
    });
    if(successCount === ids.length) {
      showToast(`${ids.length} arquivo(s) renovados`);
    } else {
      showToast(`${successCount} de ${ids.length} arquivo(s) renovados`);
    }
    renderBulkBar();
    await loadFiles();
  });

  function formatTime(epochSec, insideDay) {
    if(!epochSec) return '';
    const d = new Date(epochSec * 1000);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    if(insideDay) return `${hh}:${mm}`;
    const day = String(d.getDate()).padStart(2, '0');
    const mo = String(d.getMonth() + 1).padStart(2, '0');
    return `${day}/${mo} ${hh}:${mm}`;
  }

  function formatCountdown(seconds) {
    if(seconds === undefined || seconds === null || seconds < 0) return 'nunca';
    if(seconds === 0) return 'expirado';
    if(seconds < 60) return `${seconds}s`;
    if(seconds < 3600) return `${Math.floor(seconds/60)}min`;
    if(seconds < 86400) { const h = Math.floor(seconds/3600); const m = Math.floor((seconds%3600)/60); return m > 0 ? `${h}h ${m}min` : `${h}h`; }
    const d = Math.floor(seconds/86400); const h = Math.floor((seconds%86400)/3600);
    return h > 0 ? `${d}d ${h}h` : `${d}d`;
  }

  // --- pure helpers (tested) ---
  function deriveKind(name, isImage) {
    if(isImage) return 'image';
    const ext = ((name || '').split('.').pop() || '').toLowerCase();
    if(['mp4','mov','avi','mkv','webm'].includes(ext)) return 'video';
    if(['pdf','doc','docx','txt','md','html','csv','xls','xlsx','ppt','pptx','json'].includes(ext)) return 'document';
    return 'other';
  }

  function resolveFolderChip(file, folders, view, query) {
    const isSearch = Boolean(query && String(query).trim());
    const isExpiring = view === 'expiring';
    if(!isSearch && !isExpiring) return null;
    if(!file || !file.folder_id) return null;
    const match = (folders || []).find(fo => fo.id === file.folder_id);
    return match ? match.name : (file.folder_name || null);
  }

  function buildRows({ files, folders, view, kind, query, allLoaded, now }) {
    const fileList = files || [], folderList = folders || [], q = (query || '').trim().toLowerCase();
    if(q) {
      const match = (!kind || kind === 'all') ? folderList.filter(fo => (fo.name || '').toLowerCase().includes(q)) : [];
      return [...match.map(fo => ({ type: 'folder', ...fo, folder: fo, insideDay: false })), ...fileList.map(f => ({ type: 'file', ...f, file: f, folderChip: resolveFolderChip(f, folderList, view, q), insideDay: false }))];
    }
    if(view && view !== 'all' && view !== 'root') return fileList.map(f => ({ type: 'file', ...f, file: f, folderChip: resolveFolderChip(f, folderList, view, q), insideDay: false }));
    let eligible = [];
    if((view === 'all' || !view) && (!kind || kind === 'all')) {
      const oldest = fileList.length > 0 ? Math.min(...fileList.map(f => f.created_at)) : null;
      eligible = folderList.filter(fo => allLoaded || (oldest !== null && (fo.updated_at || 0) >= oldest));
    }
    const entries = [...eligible.map(fo => ({ type: 'folder', time: fo.updated_at || 0, data: fo })), ...fileList.map(f => ({ type: 'file', time: f.created_at || 0, data: f }))];
    entries.sort((a, b) => (b.time - a.time) || (a.type === 'folder' ? -1 : 1));
    const nowDate = now instanceof Date ? now : (typeof now === 'number' ? (now > 1e11 ? new Date(now) : new Date(now * 1000)) : new Date());
    const nowYear = nowDate.getFullYear(), yest = new Date(nowDate.getFullYear(), nowDate.getMonth(), nowDate.getDate() - 1);
    const MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
    const sameDay = (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
    const dayLabel = d => {
      const base = `${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear() !== nowYear ? ' ' + d.getFullYear() : ''}`;
      return sameDay(d, nowDate) ? `Hoje · ${base}` : (sameDay(d, yest) ? `Ontem · ${base}` : base);
    };
    const dayGroups = [];
    let curGroup = null, curKey = null;
    for(const entry of entries) {
      const d = new Date(entry.time * 1000), key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      if(key !== curKey) { curKey = key; curGroup = { date: d, entries: [] }; dayGroups.push(curGroup); }
      curGroup.entries.push(entry);
    }
    const rows = [];
    for(const g of dayGroups) {
      const fos = g.entries.filter(e => e.type === 'folder'), fis = g.entries.filter(e => e.type === 'file'), parts = [];
      if(fos.length) parts.push(fos.length === 1 ? '1 pasta' : `${fos.length} pastas`);
      if(fis.length) parts.push(fis.length === 1 ? '1 arquivo solto' : `${fis.length} arquivos soltos`);
      const summary = parts.join(' · ');
      rows.push({ type: 'day', label: dayLabel(g.date), summary, sub: summary });
      for(const entry of g.entries) {
        const extra = entry.type === 'file' ? { folderChip: resolveFolderChip(entry.data, folderList, view, q) } : {};
        rows.push({ type: entry.type, ...entry.data, [entry.type]: entry.data, ...extra, insideDay: true });
      }
    }
    return rows;
  }
  // --- end pure helpers ---

  function formatLast(epoch) {
    if(!epoch) return 'nunca';
    const diff = Math.max(0, Date.now()/1000 - epoch);
    if(diff < 60) return 'ha poucos segundos';
    if(diff < 3600) return `ha ${Math.floor(diff/60)}min`;
    if(diff < 86400) return `ha ${Math.floor(diff/3600)}h`;
    return `ha ${Math.floor(diff/86400)}d`;
  }

  function formatSize(bytes) {
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    if(bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
    return (bytes/1073741824).toFixed(2) + ' GB';
  }

  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

  function copyLink(url, btn) {
    navigator.clipboard.writeText(url).then(() => {
      btn.classList.add('copied'); showToast('Link copiado!');
      setTimeout(() => btn.classList.remove('copied'), 2000);
    }).catch(err => {
      try {
        const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        btn.classList.add('copied'); showToast('Link copiado!');
        setTimeout(() => btn.classList.remove('copied'), 2000);
      } catch(e) {
        logError('copy_failed', err || e);
      }
    });
  }

  function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }

  setInterval(() => {
    if(currentPage === 1 && selectedIds.size === 0 && !confirmingId && !openPanelId && openVersions.size === 0) {
      loadFiles();
      loadFolders();
    }
  }, 30000);
  fetch('/api/me').then(r=>r.json()).then(d=>{ if(d.email) document.getElementById('userEmail').textContent = d.email; }).catch(e => logError('me_failed', e));
  loadFiles();
  loadFolders();
})();
</script>
